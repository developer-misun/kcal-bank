<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>식단 기록장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: single phone column — today's gauge on top, meal list, quick add, then weight and history */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#1c2b28; --muted:#647571; --line:#dbe3e0;
  --accent:#1f7a68; --accent-soft:#d8eee8; --over:#c2412d; --over-soft:#fbe3de; --warn:#b7791f;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221f; --ink:#e4ece9; --muted:#93a39f; --line:#2a3632;
  --accent:#4cc3a6; --accent-soft:#1d3a33; --over:#ef7a64; --over-soft:#3d221c; --warn:#e0a84a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221f; --ink:#e4ece9; --muted:#93a39f; --line:#2a3632;
  --accent:#4cc3a6; --accent-soft:#1d3a33; --over:#ef7a64; --over-soft:#3d221c; --warn:#e0a84a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-size:1.15rem;margin:0;font-weight:700}
h2{font-size:.78rem;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:500}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav{display:flex;align-items:center;gap:4px}
.daynav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;cursor:pointer}
.top{flex-wrap:wrap;row-gap:8px}
.top h1{white-space:nowrap}
.daynav{margin-left:auto}
.daynav span{min-width:0!important;padding:0 2px}
.tabs button{white-space:nowrap;padding:9px 2px!important;font-size:.92rem}
.daynav button.today{white-space:nowrap;width:auto;border-radius:999px;padding:0 12px;font:inherit;font-size:.82rem;font-weight:700;background:var(--accent);border-color:var(--accent);color:var(--bg)}
.daynav span{min-width:108px;text-align:center;font-weight:500}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dday{margin-left:auto;align-self:center;font-family:var(--mono);font-weight:600;font-size:1.05rem;color:var(--accent);background:var(--accent-soft);padding:3px 12px;border-radius:999px}
.dday:empty{display:none}
.big .num{font-size:2.4rem;font-weight:600;line-height:1}
.big small{color:var(--muted)}
.bar{height:12px;border-radius:6px;background:var(--accent-soft);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.gauge.over .bar{background:var(--over-soft)} .gauge.over .bar i{background:var(--over)}
.pill{display:inline-block;font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.gauge.over .pill{background:var(--over-soft);color:var(--over)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:10px}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--mono);font-size:1rem}
.stats span{font-size:.75rem;color:var(--muted)}
.meal{margin-bottom:10px}
.meal-head{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);padding:0 2px 4px;border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px dashed var(--line)}
.item .n{flex:1;min-width:0}
.item .k{font-family:var(--mono)}
.del{border:none;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:2px 6px}
.empty{color:var(--muted);font-size:.85rem;padding:6px 2px}
form.add{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.add .full{grid-column:1/-1}
.actions{display:grid;grid-template-columns:3fr 2fr;gap:10px}
.act{font:inherit;font-weight:600;border-radius:12px;padding:13px 10px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act.main{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
dialog.sheet{border:none;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;background:var(--surface);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(0,0,0,.45)}
dialog.sheet form.add,.sheet-in{padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-in{display:flex;flex-direction:column;gap:14px}
.sheet-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
.sheet-head h3{margin:0;font-size:1rem}
.sheet-head .x{border:none;background:none;color:var(--muted);font-size:1.5rem;line-height:1;cursor:pointer;padding:2px 8px}
.lab2{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted)}
.sheet .done{background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:11px;font:inherit;font-weight:700;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
form.add button[type=submit]{grid-column:1/-1;background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:11px;font:inherit;font-weight:700;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.field label{font-size:.8rem;color:var(--muted)}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.goal p{margin:0;font-size:.9rem}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:24px 92px 1fr 52px 58px;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:.88rem;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;color:var(--ink);text-align:left;font-family:inherit}
.hrow .mini{height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden}
.hrow .mini i{display:block;height:100%;background:var(--accent)}
.hrow.over .mini i{background:var(--over)} .hrow.over .k{color:var(--over)}
.hrow .w{color:var(--muted);text-align:right;white-space:nowrap}
.hrow .w.tap{color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.note{font-size:.78rem;color:var(--muted);text-align:center}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:none;background:none;padding:9px;border-radius:9px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.view{display:flex;flex-direction:column;gap:18px}
.view[hidden]{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip.warn{background:var(--over-soft);color:var(--over);border-color:transparent}
#pList section{margin-bottom:16px}
.gform{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gform .full{grid-column:1/-1}
.gform .lab{font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.gform .sub2{font-size:.7rem}
.gform button{background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:11px;font:inherit;font-weight:700;cursor:pointer}
.gform button.ghost{background:var(--accent-soft);color:var(--accent)}
.calc{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.85rem;color:var(--muted)}
.crow{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline}
.crow b{text-align:right;color:var(--ink)}
.crow small{grid-column:1/-1;font-size:.72rem}
.nhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.nhead h2{margin:0}
.dayEval{margin:0 0 8px;font-size:.92rem;font-weight:500}
.dayEval:empty{display:none}
.hrow .emo{font-size:1.05rem;text-align:center}
.stdLabel{font-size:.75rem;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:999px}
.nhead select{width:auto;max-width:62%;font-size:.8rem;padding:6px 8px}
.nutri{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.nrow{display:grid;grid-template-columns:64px 1fr 96px;grid-template-areas:"l b v" ". g g";column-gap:10px;row-gap:2px;align-items:center}
.nl{grid-area:l;font-size:.88rem;font-weight:500}
.nv{grid-area:v;font-size:.86rem;font-weight:600;text-align:right;white-space:nowrap}
.nbar{grid-area:b;height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}
.nbar i{display:block;height:100%;border-radius:4px;background:var(--muted)}
.ng{grid-area:g;font-size:.72rem;color:var(--muted)}
.nrow.good .nbar i{background:var(--accent)} .nrow.good .nv{color:var(--accent)}
.nrow.low .nbar i{background:var(--warn)} .nrow.low .nv{color:var(--warn)}
.nrow.mid .nbar i{background:var(--warn)} .nrow.mid .nv{color:var(--warn)}
.nrow.bad .nbar{background:var(--over-soft)} .nrow.bad .nbar i{background:var(--over)} .nrow.bad .nv{color:var(--over)}
form.add details.fnut{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
form.add details.fnut .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
form.add .lab{font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.nchip{font:inherit;font-size:.82rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.nchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.hint{font-size:.8rem;color:var(--muted);margin:8px 0 2px}
.val{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:64px}
.val:empty{display:none}
.val b{font-family:var(--mono);font-size:.92rem}
.vbar{width:64px;height:5px;border-radius:3px;background:var(--accent-soft);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--accent)}
.vbar.bad{background:var(--over-soft)} .vbar.bad i{background:var(--over)}
.pi{border-bottom:1px solid var(--line)}
.pi-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 2px}
.pi-main{background:none;border:none;text-align:left;font:inherit;color:var(--ink);cursor:pointer;padding:0;min-width:0}
.pi-main .sub{display:block;font-size:.76rem;color:var(--muted)}
.exp{font-size:.72rem;font-family:var(--mono);padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.exp.soon{background:var(--over-soft);color:var(--over)}
.exp:empty{display:none}
.stock{font:inherit;font-size:.78rem;border:1px solid var(--accent);border-radius:999px;padding:3px 10px;background:var(--surface);color:var(--accent);cursor:pointer;min-width:52px}
.stock.s1{color:var(--warn);border-color:var(--warn)} .stock.s2{color:var(--muted);border-color:var(--line)}
.pi-detail{padding:0 2px 12px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nut div{background:var(--bg);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;font-size:.72rem}
.nut b{font-family:var(--mono);color:var(--ink);font-size:.88rem}
.tag{font-size:.7rem;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:6px;font-weight:500}
.tag.est{background:var(--bg);color:var(--muted)}
.acts{display:flex;gap:14px;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--accent);font:inherit;font-size:.82rem;cursor:pointer;padding:0;font-weight:500}
.linkbtn.del2{color:var(--over)}
form.padd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
form.padd .full{grid-column:1/-1}
form.padd .lab{font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
form.padd details{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
form.padd details .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
form.padd button{grid-column:1/-1;background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:11px;font:inherit;font-weight:700;cursor:pointer}
.range{display:flex;gap:6px}
.range button{font:inherit;font-size:.82rem;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.range button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:.75rem;color:var(--muted)}
.tile b{font-family:var(--mono);font-size:1.35rem;font-weight:600;line-height:1.3}
.tile small{font-size:.72rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chead h2{margin:0}
.legend{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:6px}
.lg.ok{background:var(--accent)} .lg.over{background:var(--over)}
.lg.line{height:0;border-top:2px dashed var(--muted);border-radius:0;width:14px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:15px;font-family:var(--mono)}
.chart .goal{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.chart .bar-ok{fill:var(--accent)} .chart .bar-over{fill:var(--over)}
.chart .wline{fill:none;stroke:var(--accent);stroke-width:2}
.chart .wdot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .vlab{fill:var(--ink);font-size:16px;font-family:var(--mono);font-weight:600}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover,.chart .hit.on{fill:var(--ink);fill-opacity:.06}
.cap{margin:0;font-size:.78rem;color:var(--muted)}
.nutri.plain{border:none;padding:0}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;line-height:1.4;padding:6px 10px;border-radius:8px;max-width:220px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.tip b{font-family:var(--mono)}
.daynav.off{visibility:hidden}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1 id="appTitle">식단 기록장</h1>
    <div class="daynav">
      <button id="prev" aria-label="이전 날">‹</button>
      <span id="dayLabel" class="num"></span>
      <button id="next" aria-label="다음 날">›</button>
      <button id="today" class="today" type="button" hidden>오늘</button>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabDash" aria-selected="true">대시보드</button>
    <button role="tab" id="tabDiet" aria-selected="false">식단</button>
    <button role="tab" id="tabPantry" aria-selected="false">영양 참고</button>
    <button role="tab" id="tabGoal" aria-selected="false">목표</button>
  </div>

  <div class="view" id="viewDiet" hidden>
  <section class="gauge" id="gauge">
    <div class="big"><span class="num" id="total">0</span><small id="goalSmall">/ 1,500 kcal</small><span class="dday" id="dDay"></span></div>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div><span class="pill" id="leftPill">1,500 kcal 남음</span></div>
    <div class="stats">
      <div><b id="sBase">1,290</b><span>기초대사량</span></div>
      <div><b id="sActive">–</b><span>워치 활동</span></div>
      <div><b id="sBuf">0</b><span>이번 주 저금통</span></div>
    </div>
  </section>

  <section>
    <div class="nhead"><h2>영양소 (기준 대비)</h2><span class="stdLabel" id="stdLabel"></span></div>
    <p class="dayEval" id="dayEval"></p>
    <div class="nutri" id="nutri"></div>
    <p class="hint" id="nutriNote"></p>
  </section>

  <section>
    <h2>먹은 음식</h2>
    <div id="meals"></div>
  </section>

  <div class="actions">
    <button type="button" class="act main" id="openFood">+ 음식 추가</button>
    <button type="button" class="act" id="openBody">워치 · 체중</button>
  </div>

  <dialog class="sheet" id="dlgFood" aria-labelledby="dlgFoodH">
  <form class="add" id="addForm">
    <div class="sheet-head"><h3 id="dlgFoodH">음식 추가</h3><button type="button" class="x" data-close aria-label="닫기">×</button></div>
    <select id="fMeal" aria-label="식사">
      <option>아침</option><option>점심</option><option>저녁</option><option selected>간식</option>
    </select>
    <input id="fKcal" type="number" inputmode="numeric" min="0" placeholder="kcal" required aria-label="칼로리" class="num">
    <input id="fName" class="full" placeholder="음식 이름 (양도 같이, 예: 방울토마토 200g)" required aria-label="음식 이름">
    <details class="fnut">
      <summary>영양소 (선택)</summary>
      <div class="g">
        <label class="lab">탄수화물 g<input id="fCarb" type="number" step="0.1" min="0" class="num"></label>
        <label class="lab">단백질 g<input id="fProt" type="number" step="0.1" min="0" class="num"></label>
        <label class="lab">지방 g<input id="fFat" type="number" step="0.1" min="0" class="num"></label>
        <label class="lab">식이섬유 g<input id="fFib" type="number" step="0.1" min="0" class="num"></label>
        <label class="lab">당류 g<input id="fSugar" type="number" step="0.1" min="0" class="num"></label>
        <label class="lab">나트륨 mg<input id="fNa" type="number" min="0" class="num"></label>
      </div>
    </details>
    <button type="submit">추가</button>
  </form>
  </dialog>

  <dialog class="sheet" id="dlgBody" aria-labelledby="dlgBodyH">
    <div class="sheet-in">
      <div class="sheet-head"><h3 id="dlgBodyH">워치 · 체중</h3><button type="button" class="x" data-close aria-label="닫기">×</button></div>
      <label class="lab2" for="fActive">워치 활동 칼로리<input id="fActive" type="number" inputmode="numeric" min="0" placeholder="예: 250" class="num"></label>
      <label class="lab2" for="fWeight">체중 kg (월요일 아침 공복, 주 1회)<input id="fWeight" type="number" inputmode="decimal" step="0.1" min="0" placeholder="예: 65.5" class="num"></label>
      <button type="button" class="done" data-close>완료</button>
    </div>

<script>
/* ================= 데이터 구조 (테이블 단위) =================
   entries/{날짜-순번}  먹은 음식 한 줄
   activity/{날짜}      워치 활동 kcal
   body/{날짜}          체중 (건강 정보, 이 기기·이 기록장 안에만)
   foods/{id}           음식·제품 영양 DB
   settings/goal        목표 설정
   하루 합계·저금통·평가는 저장하지 않고 계산한다. */
const MEAL_CODES = [["breakfast","아침"],["lunch","점심"],["dinner","저녁"],["snack","간식"]];
const MEAL_LABEL = Object.fromEntries(MEAL_CODES);
const MEAL_CODE = Object.fromEntries(MEAL_CODES.map(([c,l]) => [l,c]));
const CAT_CODES = [["protein","단백질"],["veg_fruit","채소·과일"],["grain","밥·면·곡물"],["dairy","유제품"],["snack_drink","간식·음료"],["etc","양념·기타"]];
const CAT_LABEL = Object.fromEntries(CAT_CODES);
const SRC_LABEL = {label:"성분표", estimate:"추정", unknown:"미표기"};
const NUTS = ["kcal","carbs","protein","fat","fiber","sugar","sodium"];

const GDEF = {sex:"f", age:30, height:160, activityLevel:1.375, startDate:new Date().toISOString().slice(0,10), startWeight:60, targetWeight:55, goalKcal:1500, minKcal:1200, watchBaseKcal:200, standardId:"custom"};
let G = {...GDEF};
const fmt = n => Math.round(n).toLocaleString("ko-KR");
const pad = n => String(n).padStart(2,"0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const $ = id => document.getElementById(id);
const has = v => v !== undefined && v !== null && v !== "";
let GOAL = G.goalKcal, START_W = G.startWeight, TARGET_W = G.targetWeight, BMR = 1290;

let cur = keyOf(new Date());
/* 테이블 상태: id → 행 */
const T = {entries:{}, activity:{}, body:{}, foods:{}};
let db = null;

/* ---------- 저장소: db가 있으면 db, 없으면 이 브라우저(localStorage) ---------- */
const LS_KEY = "kcalbank-v2";
function lsLoad(){ try { const v = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (v){ ["entries","activity","body","foods"].forEach(t => T[t] = v[t] || {}); if (v.settings) G = {...GDEF, ...v.settings}; } } catch(e){} }
function lsSave(){ try { localStorage.setItem(LS_KEY, JSON.stringify({...T, settings:G})); } catch(e){} }
async function put(table, id, row){
  T[table][id] = row; renderAll();
  if (db){ try { await db.collection(table).doc(id).set(row); okNote(); } catch(e){ failNote(); } } else lsSave();
}
async function del(table, id){
  delete T[table][id]; renderAll();
  if (db){ try { await db.collection(table).doc(id).delete(); okNote(); } catch(e){ failNote(); } } else lsSave();
}
const okNote = () => { $("saveNote").textContent = "기록은 자동으로 저장돼요."; };
const failNote = () => { $("saveNote").textContent = "저장하지 못했어요. 잠시 후 다시 시도해 주세요."; };

/* ---------- 하루 보기용 묶음 (계산) ---------- */
function entriesOf(k){ return Object.values(T.entries).filter(e => e.date === k).sort((a,b) => a.id < b.id ? -1 : 1); }
function dayOf(k){
  return {date:k, items:entriesOf(k), active: T.activity[k] ? T.activity[k].activeKcal : null, weight: T.body[k] ? T.body[k].weightKg : null};
}
const sum = d => (d.items||[]).reduce((a,i)=>a+(+i.kcal||0),0);
function nextEntryId(k){
  let n = 0; entriesOf(k).forEach(e => { const m = +String(e.id).slice(11); if (m > n) n = m; });
  return `${k}-${pad(n+1)}`;
}
function allDates(){
  const s = new Set();
  Object.values(T.entries).forEach(e => s.add(e.date));
  Object.keys(T.body).forEach(k => s.add(k));
  return [...s].sort();
}
function latestWeight(){
  const ks = Object.keys(T.body).sort().reverse();
  for (const k of ks) if (T.body[k].weightKg) return {k, w:T.body[k].weightKg};
  return null;
}

/* ---------- 영양소 기준 ---------- */
const STD = {custom:{label:"맞춤: 감량·건강", carb:130, prot:60, fat:30, fib:20, sug:50, sugSoft:25, na:2000}};
const STD_GROUPS = [
  ["성인 여성", [["f19","19~29세",2000,55,20,2300],["f30","30~49세",1900,50,20,2300],["f50","50~64세",1700,50,25,2300],["f65","65~74세",1600,50,25,1900],["f75","75세 이상",1500,50,25,1800]]],
  ["성인 남성", [["m19","19~29세",2600,65,30,2300],["m30","30~49세",2500,65,30,2300],["m50","50~64세",2200,60,30,2300],["m65","65~74세",2000,60,30,1900],["m75","75세 이상",1900,60,30,1800]]],
  ["청소년", [["f12","12~14세 여자",2000,55,20,2300],["m12","12~14세 남자",2500,60,25,2300],["f15","15~18세 여자",2000,55,20,2300],["m15","15~18세 남자",2700,65,25,2300]]],
  ["어린이", [["k1","1~2세",900,20,10,1000,35],["k3","3~5세",1400,25,15,1500],["f6","6~8세 여아",1500,35,15,1700],["m6","6~8세 남아",1700,35,20,1700],["f9","9~11세 여아",1800,45,20,2000],["m9","9~11세 남아",2000,50,20,2000]]]
];
STD_GROUPS.forEach(([g, list]) => list.forEach(([k, l, eer, prot, fib, na, fat]) => {
  STD[k] = {label:`${g} ${l}`, carb:130, prot, fat: fat || 30, fib, sug: Math.round(eer*0.2/4), sugSoft: Math.round(eer*0.1/4), na};
}));
let stdKey = "custom";
{ const sel = $("stdSel");
  const o = document.createElement("option"); o.value = "custom"; o.textContent = STD.custom.label; sel.appendChild(o);
  STD_GROUPS.forEach(([g, list]) => { const og = document.createElement("optgroup"); og.label = g + " (2025 한국인 영양소 섭취기준)";
    list.forEach(([k, l]) => { const op = document.createElement("option"); op.value = k; op.textContent = `${g} ${l}`; og.appendChild(op); }); sel.appendChild(og); });
}

/* ---------- 식단 화면 ---------- */
function render(){
  const d = dayOf(cur), t = sum(d);
  $("dayLabel").textContent = cur;
  { const [y,m,dd] = cur.split("-").map(Number); const [sy,sm,sdd] = (G.startDate||GDEF.startDate).split("-").map(Number); const n = Math.round((new Date(y,m-1,dd) - new Date(sy,sm-1,sdd))/86400000) + 1; $("dDay").textContent = n >= 1 ? `D-${n}` : ""; }
  $("next").disabled = cur >= keyOf(new Date());
  $("today").hidden = cur >= keyOf(new Date());
  $("total").textContent = fmt(t);
  $("barFill").style.width = Math.min(100, t/GOAL*100) + "%";
  const over = t > GOAL;
  $("gauge").classList.toggle("over", over);
  $("leftPill").textContent = over ? `${fmt(t-GOAL)} kcal 초과` : `${fmt(GOAL-t)} kcal 남음` + (t < G.minKcal ? ` · 최소 ${fmt(G.minKcal)}까지 ${fmt(G.minKcal-t)}` : "");
  $("goalSmall").textContent = `/ ${fmt(GOAL)} kcal`;
  { const lw0 = latestWeight(); BMR = calcBMR(lw0 ? lw0.w : START_W); $("sBase").textContent = fmt(BMR); }
  $("sActive").textContent = d.active ? fmt(d.active) : "–";
  { const [y,m,dd] = cur.split("-").map(Number); const base = new Date(y,m-1,dd); const off = (base.getDay()+6)%7; let buf = 0;
    for (let i=off;i>=0;i--){ const k = keyOf(new Date(y,m-1,dd-i)); const dk = dayOf(k); if (dk.items.length) buf += GOAL - sum(dk) + Math.max(0, ((+dk.active||0) - (+G.watchBaseKcal||0)) / 2); }
    $("sBuf").textContent = (buf>=0?"+":"−") + fmt(Math.abs(buf)); $("sBuf").style.color = buf>=0 ? "var(--accent)" : "var(--over)"; }

  const box = $("meals"); box.textContent = "";
  let any = false;
  MEAL_CODES.forEach(([code, label]) => {
    const list = d.items.filter(i => i.meal === code);
    if (!list.length) return;
    any = true;
    const wrap = document.createElement("div"); wrap.className = "meal";
    const head = document.createElement("div"); head.className = "meal-head";
    head.innerHTML = `<span></span><span class="num"></span>`;
    head.children[0].textContent = label; head.children[1].textContent = fmt(list.reduce((a,i)=>a+(+i.kcal||0),0)) + " kcal";
    wrap.appendChild(head);
    list.forEach(i => {
      const r = document.createElement("div"); r.className = "item";
      const n = document.createElement("span"); n.className = "n"; n.textContent = i.label || i.name;
      const k = document.createElement("span"); k.className = "k"; k.textContent = fmt(i.kcal);
      const x = document.createElement("button"); x.className = "del"; x.type="button"; x.setAttribute("aria-label", (i.label || i.name)+" 삭제"); x.textContent = "×";
      x.onclick = () => del("entries", i.id);
      r.append(n,k,x); wrap.appendChild(r);
    });
    box.appendChild(wrap);
  });
  if (!any){ const e = document.createElement("div"); e.className="empty"; e.textContent = "아직 기록이 없어요. 아래에서 음식을 추가해 보세요."; box.appendChild(e); }

  { const its = d.items;
    const withN = its.filter(i => has(i.protein) || has(i.carbs) || has(i.fat));
    const S = k => withN.reduce((a,i)=>a+(+i[k]||0),0);
    const c = S("carbs"), p = S("protein"), f = S("fat"), fb = S("fiber"), sg = S("sugar"), na = S("sodium");
    const macroK = c*4 + p*4 + f*9; const fp = macroK > 0 ? f*9/macroK*100 : 0;
    const sd = STD[stdKey] || STD.custom; $("stdLabel").textContent = sd.label;
    { const ev = evalDay(d); $("dayEval").textContent = ev ? `${ev.emoji} ${ev.label} · 기준 ${ev.pass}/${ev.total} 통과` : ""; }
    const rows = [
      {l:"탄수화물", v:c, u:"g", goal:sd.carb, type:"min", note:`최소 ${sd.carb}g`},
      {l:"단백질", v:p, u:"g", goal:sd.prot, type:"min", note:`${sd.prot}g 이상`},
      {l:"지방", v:fp, u:"%", goal:sd.fat, type:"max", note:`열량의 ${sd.fat}% 이하`, extra:`${Math.round(f)}g`},
      {l:"식이섬유", v:fb, u:"g", goal:sd.fib, type:"min", note:`${sd.fib}g 이상`},
      {l:"당류", v:sg, u:"g", goal:sd.sug, type:"max", note:`${sd.sug}g 미만 (가능하면 ${sd.sugSoft}g)`, soft:sd.sugSoft},
      {l:"나트륨", v:na, u:"mg", goal:sd.na, type:"max", note:`${fmt(sd.na)}mg 미만`}
    ];
    const nb = $("nutri"); nb.textContent = "";
    rows.forEach(r => {
      const row = document.createElement("div"); row.className = "nrow";
      const ok = r.type === "min" ? r.v >= r.goal : r.v <= r.goal;
      const st = !withN.length ? "" : r.type === "min" ? (ok ? "good" : "low") : (ok ? (r.soft && r.v > r.soft ? "mid" : "good") : "bad");
      row.classList.add(st || "none");
      const lab = document.createElement("span"); lab.className = "nl"; lab.textContent = r.l;
      const bar = document.createElement("span"); bar.className = "nbar"; const fi = document.createElement("i");
      fi.style.width = Math.min(100, r.goal > 0 ? r.v / r.goal * 100 : 0) + "%"; bar.appendChild(fi);
      const val = document.createElement("span"); val.className = "nv num";
      val.textContent = `${r.u==="mg" ? fmt(r.v) : (Math.round(r.v*10)/10)}${r.u}` + (r.extra ? ` · ${r.extra}` : "");
      const gl = document.createElement("span"); gl.className = "ng"; gl.textContent = r.note;
      row.append(lab, val, bar, gl); nb.appendChild(row);
    });
    const miss = its.length - withN.length;
    $("nutriNote").textContent = !its.length ? "" : !withN.length ? "이 날은 음식별 영양소 기록이 없어요." : miss > 0 ? `영양소 정보가 없는 음식 ${miss}개는 빠져 있어요. 대부분 추정값이에요.` : "대부분 추정값이에요. 성분표가 있는 음식은 성분표 기준이에요.";
  }

  if (document.activeElement !== $("fActive")) $("fActive").value = d.active ?? "";
  if (document.activeElement !== $("fWeight")) $("fWeight").value = d.weight ?? "";
  { const p = []; if (d.active != null) p.push("워치 " + d.active); if (d.weight != null) p.push(d.weight + "kg");
    $("openBody").textContent = p.length ? p.join(" · ") : "워치 · 체중"; }


  renderDash();
}
const shownW = new Set();
/* ================= 대시보드 ================= */
let dRange = "30";
try { const r = localStorage.getItem("dash-range"); if (["14","30","all"].includes(r)) dRange = r; } catch(e){}
document.querySelectorAll(".range button").forEach(b => b.onclick = () => { dRange = b.dataset.r; try { localStorage.setItem("dash-range", dRange); } catch(e){} renderDash(); });
const SVGNS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const n = document.createElementNS(SVGNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
const addDays = (k, n) => { const [y,m,d] = k.split("-").map(Number); return keyOf(new Date(y, m-1, d+n)); };
const mmdd = k => k.slice(5).replace("-", "/");
const sgn = v => (v < 0 ? "−" : v > 0 ? "+" : "±") + fmt(Math.abs(v));
const wDelta = w => { const d = Math.round((w - START_W) * 10) / 10; return (d < 0 ? "−" + Math.abs(d) : d > 0 ? "+" + d : "±0") + "kg"; };

/* 툴팁: 마우스는 따라다니고, 터치는 누른 자리에 */
const tip = $("tip");
function showTip(ev, html){
  tip.innerHTML = html; tip.hidden = false;
  const x = ev.clientX ?? (ev.touches && ev.touches[0].clientX) ?? 0, y = ev.clientY ?? (ev.touches && ev.touches[0].clientY) ?? 0;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x - r.width / 2)) + "px";
  tip.style.top = Math.max(8, y - r.height - 14) + "px";
}
const hideTip = () => { tip.hidden = true; document.querySelectorAll(".hit.on").forEach(n => n.classList.remove("on")); };
document.addEventListener("scroll", hideTip, {passive:true});
document.addEventListener("click", e => { if (!e.target.closest(".hit")) hideTip(); });
function bindHit(node, html, onOpen){
  node.addEventListener("pointerenter", e => { if (e.pointerType === "mouse"){ node.classList.add("on"); showTip(e, html()); } });
  node.addEventListener("pointermove", e => { if (e.pointerType === "mouse") showTip(e, html()); });
  node.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hideTip(); });
  node.addEventListener("click", e => {
    if (node.classList.contains("on") && onOpen && e.pointerType !== "mouse"){ hideTip(); onOpen(); return; }
    if (e.pointerType === "mouse" && onOpen){ hideTip(); onOpen(); return; }
    hideTip(); node.classList.add("on"); showTip(e, html() + (onOpen ? "<br><small>한 번 더 누르면 그날로 이동</small>" : ""));
  });
}
const goDay = k => { cur = k; showTab("d"); render(); window.scrollTo({top:0, behavior:"smooth"}); };

function rangeDays(){
  const today = keyOf(new Date());
  let from = dRange === "all" ? (allDates()[0] || today) : addDays(today, -(+dRange) + 1);
  if (dRange === "all" && G.startDate && G.startDate < from) from = G.startDate;
  const out = []; for (let k = from; k <= today; k = addDays(k, 1)) out.push(k);
  return out;
}

function chartKcal(days){
  const box = $("chKcal"); box.textContent = "";
  const W = 520, H = 230, L = 40, R = 6, T = 10, B = 28, pw = W - L - R, ph = H - T - B;
  const vals = days.map(k => sum(dayOf(k)));
  const max = Math.max(GOAL * 1.2, ...vals) ;
  const top = Math.ceil(max / 500) * 500;
  const y = v => T + ph - v / top * ph;
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":`하루 칼로리 막대 그래프, 목표 ${GOAL}kcal`}, box);
  for (let v = 0; v <= top; v += 500){ el("line", {x1:L, x2:W-R, y1:y(v), y2:y(v), class:"grid"}, svg); const t = el("text", {x:L-4, y:y(v)+3, "text-anchor":"end", class:"axis"}, svg); t.textContent = v >= 1000 ? (v/1000)+"k" : v; }
  const bw = pw / days.length, gap = Math.min(2, bw * 0.25), w = Math.max(1, bw - gap);
  days.forEach((k, i) => {
    const v = vals[i], x = L + i * bw + gap / 2;
    if (v > 0){
      const h = Math.max(1, y(0) - y(v)), r = Math.min(4, w / 2, h);
      const x0 = x, x1 = x + w, y0 = y(0), y1 = y0 - h;
      el("path", {d:`M${x0},${y0} V${y1 + r} Q${x0},${y1} ${x0 + r},${y1} H${x1 - r} Q${x1},${y1} ${x1},${y1 + r} V${y0} Z`, class: v > GOAL ? "bar-over" : "bar-ok"}, svg);
    }
    const step = days.length > 45 ? 21 : days.length > 20 ? 10 : 5;
    if (i % step === 0 || i === days.length - 1){ const t = el("text", {x: x + w/2, y: H - 6, "text-anchor": i === 0 ? "start" : i === days.length - 1 ? "end" : "middle", class:"axis"}, svg); t.textContent = mmdd(k); }
    const hit = el("rect", {x: L + i * bw, y: T, width: bw, height: ph, class:"hit"}, svg);
    bindHit(hit, () => { const d = dayOf(k), ev = evalDay(d); return `${k}<br><b>${d.items.length ? fmt(v) + " kcal" : "기록 없음"}</b>` + (d.items.length ? (v > GOAL ? ` · ${fmt(v-GOAL)} 초과` : ` · ${fmt(GOAL-v)} 남음`) : "") + (ev ? `<br>${ev.emoji} ${ev.label}` : "") + (d.active ? `<br>워치 ${fmt(d.active)}` : ""); }, d => goDay(k));
  });
  el("line", {x1:L, x2:W-R, y1:y(GOAL), y2:y(GOAL), class:"goal"}, svg); $("goalLg").textContent = fmt(GOAL);
}

function chartWeight(days){
  const box = $("chWeight"); box.textContent = "";
  const pts = days.filter(k => T.body[k] && T.body[k].weightKg).map(k => ({k, w: T.body[k].weightKg, d: Math.round((T.body[k].weightKg - START_W) * 10) / 10}));
  if (!pts.length){ box.textContent = ""; $("capWeight").textContent = "이 기간에 체중 기록이 없어요. 월요일 아침 공복에 재서 넣어 주세요."; return; }
  const W = 520, H = 210, L = 40, R = 70, T0 = 16, B = 28, pw = W - L - R, ph = H - T0 - B;
  const dmin = Math.min(0, ...pts.map(p => p.d), TARGET_W - START_W > -3 ? TARGET_W - START_W : -3), dmax = Math.max(0.5, ...pts.map(p => p.d));
  const lo = Math.floor(dmin), hi = Math.ceil(dmax);
  const x = k => L + (days.indexOf(k) / Math.max(1, days.length - 1)) * pw;
  const y = v => T0 + (hi - v) / (hi - lo) * ph;
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":"시작 체중 대비 변화 꺾은선 그래프"}, box);
  const stepY = (hi - lo) > 6 ? 2 : 1;
  for (let v = hi; v >= lo; v -= stepY){ el("line", {x1:L, x2:W-R, y1:y(v), y2:y(v), class:"grid"}, svg); const t = el("text", {x:L-4, y:y(v)+3, "text-anchor":"end", class:"axis"}, svg); t.textContent = (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v); }
  const tgt = TARGET_W - START_W;
  if (tgt >= lo){ el("line", {x1:L, x2:W-R, y1:y(tgt), y2:y(tgt), class:"goal"}, svg); const t = el("text", {x:W-R+4, y:y(tgt)+3, class:"axis"}, svg); t.textContent = "목표"; }
  if (pts.length > 1) el("polyline", {points: pts.map(p => `${x(p.k)},${y(p.d)}`).join(" "), class:"wline"}, svg);
  pts.forEach((p, i) => {
    el("circle", {cx:x(p.k), cy:y(p.d), r:5, class:"wdot"}, svg);
    if (i === pts.length - 1){ const t = el("text", {x:x(p.k)+8, y:y(p.d)+4, class:"vlab"}, svg); t.textContent = wDelta(p.w); }
    const hit = el("circle", {cx:x(p.k), cy:y(p.d), r:14, class:"hit"}, svg);
    bindHit(hit, () => `${p.k}<br><b>${wDelta(p.w)}</b> (시작 대비)`, null);
  });
  const fk = days[0], lk = days[days.length - 1];
  [[fk, "start"], [lk, "end"]].forEach(([k, a]) => { const t = el("text", {x:x(k), y:H-6, "text-anchor":a, class:"axis"}, svg); t.textContent = mmdd(k); });
  const last = pts[pts.length - 1];
  $("capWeight").textContent = `최근 ${last.k} · 시작 대비 ${wDelta(last.w)} · 목표까지 ${Math.max(0, Math.round((last.w - TARGET_W) * 10) / 10)}kg. 실제 체중은 아래 일자별 기록에서 눌러 볼 수 있어요.`;
}

function weekBanks(days){
  const weeks = {};
  days.forEach(k => {
    const [y,m,d] = k.split("-").map(Number); const dt = new Date(y, m-1, d); const mon = keyOf(new Date(y, m-1, d - (dt.getDay() + 6) % 7));
    const dk = dayOf(k); if (!dk.items.length) { weeks[mon] = weeks[mon] || 0; return; }
    weeks[mon] = (weeks[mon] || 0) + GOAL - sum(dk) + Math.max(0, ((+dk.active || 0) - (+G.watchBaseKcal || 0)) / 2);
  });
  return Object.entries(weeks).sort((a, b) => a[0] < b[0] ? -1 : 1);
}
function chartBank(days){
  const box = $("chBank"); box.textContent = "";
  const wk = weekBanks(days); if (!wk.length) return;
  const W = 520, H = 200, L = 58, R = 6, T0 = 24, B = 28, pw = W - L - R, ph = H - T0 - B;
  const amax = Math.max(500, ...wk.map(([, v]) => Math.abs(v)));
  const top = Math.ceil(amax / 500) * 500, hasNeg = wk.some(([, v]) => v < 0);
  const lo = hasNeg ? -top : 0;
  const y = v => T0 + (top - v) / (top - lo) * ph;
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":"주간 저금통 막대 그래프"}, box);
  [top, 0, lo].filter((v, i, a) => a.indexOf(v) === i).forEach(v => { el("line", {x1:L, x2:W-R, y1:y(v), y2:y(v), class: v === 0 ? "goal" : "grid"}, svg); const t = el("text", {x:L-4, y:y(v)+3, "text-anchor":"end", class:"axis"}, svg); t.textContent = sgn(v); });
  const bw = pw / wk.length, w = Math.min(56, bw * 0.6);
  wk.forEach(([mon, v], i) => {
    const cx = L + i * bw + bw / 2, x0 = cx - w / 2, x1 = cx + w / 2, y0 = y(0), y1 = y(v), r = Math.min(4, w / 2, Math.abs(y1 - y0));
    if (Math.abs(v) >= 1){
      const d = v >= 0 ? `M${x0},${y0} V${y1 + r} Q${x0},${y1} ${x0 + r},${y1} H${x1 - r} Q${x1},${y1} ${x1},${y1 + r} V${y0} Z`
                       : `M${x0},${y0} V${y1 - r} Q${x0},${y1} ${x0 + r},${y1} H${x1 - r} Q${x1},${y1} ${x1},${y1 - r} V${y0} Z`;
      el("path", {d, class: v >= 0 ? "bar-ok" : "bar-over"}, svg);
    }
    if (i === wk.length - 1 || wk.length <= 6){ const t = el("text", {x:cx, y: v >= 0 ? y1 - 6 : y1 + 18, "text-anchor":"middle", class:"vlab"}, svg); t.textContent = sgn(Math.round(v)); }
    const t2 = el("text", {x:cx, y:H-6, "text-anchor":"middle", class:"axis"}, svg); t2.textContent = mmdd(mon) + "~";
    const hit = el("rect", {x:L + i * bw, y:T0, width:bw, height:ph, class:"hit"}, svg);
    bindHit(hit, () => `${mon} 주<br><b>${sgn(Math.round(v))} kcal</b>` + (v >= 0 ? " 남김" : " 넘음"), null);
  });
}

function dashNutri(days){
  const its = days.flatMap(k => dayOf(k).items);
  const nd = days.filter(k => dayOf(k).items.some(i => has(i.protein) || has(i.carbs) || has(i.fat)));
  const sd = STD[stdKey] || STD.custom; $("dStd").textContent = sd.label;
  const box = $("dNutri"); box.textContent = "";
  if (!nd.length){ $("dNutriNote").textContent = "이 기간에는 영양소 기록이 없어요."; return; }
  const S = k => nd.reduce((a, day) => a + dayOf(day).items.reduce((b, i) => b + (+i[k] || 0), 0), 0) / nd.length;
  const c = S("carbs"), p = S("protein"), f = S("fat"), fb = S("fiber"), sg = S("sugar"), na = S("sodium");
  const mk = c*4 + p*4 + f*9, fp = mk > 0 ? f*9/mk*100 : 0;
  const passDays = key => nd.filter(day => { const its2 = dayOf(day).items; const T2 = n => its2.reduce((a,i)=>a+(+i[n]||0),0);
    const cc = T2("carbs"), pp = T2("protein"), ff = T2("fat"), m2 = cc*4+pp*4+ff*9;
    return key === "carbs" ? cc >= sd.carb : key === "protein" ? pp >= sd.prot : key === "fat" ? (m2 > 0 && ff*9/m2*100 <= sd.fat) : key === "fiber" ? T2("fiber") >= sd.fib : key === "sugar" ? T2("sugar") <= sd.sug : T2("sodium") <= sd.na; }).length;
  [{l:"탄수화물", k:"carbs", v:c, u:"g", goal:sd.carb, type:"min"}, {l:"단백질", k:"protein", v:p, u:"g", goal:sd.prot, type:"min"},
   {l:"지방", k:"fat", v:fp, u:"%", goal:sd.fat, type:"max"}, {l:"식이섬유", k:"fiber", v:fb, u:"g", goal:sd.fib, type:"min"},
   {l:"당류", k:"sugar", v:sg, u:"g", goal:sd.sug, type:"max", soft:sd.sugSoft}, {l:"나트륨", k:"sodium", v:na, u:"mg", goal:sd.na, type:"max"}].forEach(r => {
    const row = document.createElement("div"); row.className = "nrow";
    const ok = r.type === "min" ? r.v >= r.goal : r.v <= r.goal;
    row.classList.add(r.type === "min" ? (ok ? "good" : "low") : (ok ? (r.soft && r.v > r.soft ? "mid" : "good") : "bad"));
    const lab = document.createElement("span"); lab.className = "nl"; lab.textContent = r.l;
    const bar = document.createElement("span"); bar.className = "nbar"; const fi = document.createElement("i"); fi.style.width = Math.min(100, r.v / r.goal * 100) + "%"; bar.appendChild(fi);
    const val = document.createElement("span"); val.className = "nv num"; val.textContent = (r.u === "mg" ? fmt(r.v) : Math.round(r.v * 10) / 10) + r.u;
    const gl = document.createElement("span"); gl.className = "ng"; gl.textContent = `기준 통과 ${passDays(r.k)}/${nd.length}일`;
    row.append(lab, val, bar, gl); box.appendChild(row);
  });
  $("dNutriNote").textContent = `영양소가 기록된 ${nd.length}일의 하루 평균이에요. 대부분 추정값이에요.`;
}

function dashTiles(days){
  const box = $("dTiles"); box.textContent = "";
  const today = keyOf(new Date());
  const lw = latestWeight();
  const wb = weekBanks([...Array(7)].map((_, i) => addDays(today, -6 + i)).filter(k => { const [y,m,d] = today.split("-").map(Number); const t = new Date(y,m-1,d); const mon = keyOf(new Date(y,m-1,d-(t.getDay()+6)%7)); return k >= mon; }));
  const bank = wb.length ? wb[wb.length - 1][1] : 0;
  const rec = days.filter(k => dayOf(k).items.length);
  const avg = rec.length ? rec.reduce((a, k) => a + sum(dayOf(k)), 0) / rec.length : 0;
  const good = rec.filter(k => { const ev = evalDay(dayOf(k)); return ev && (ev.emoji === "😄" || ev.emoji === "🙂"); }).length;
  const within = rec.filter(k => sum(dayOf(k)) <= GOAL).length;
  [["시작 대비 체중", lw ? wDelta(lw.w) : "–", lw ? `${lw.k} 기준` : "체중을 넣어 주세요"],
   ["이번 주 저금통", sgn(Math.round(bank)), "kcal"],
   ["하루 평균", rec.length ? fmt(avg) : "–", `기록한 ${rec.length}일 · 목표 ${fmt(GOAL)}`],
   ["목표 안에서 마친 날", rec.length ? `${within}/${rec.length}` : "–", `😄🙂 평가 ${good}일`]].forEach(([a, b, c]) => {
    const t = document.createElement("div"); t.className = "tile";
    const s1 = document.createElement("span"); s1.textContent = a; const b1 = document.createElement("b"); b1.textContent = b; const s2 = document.createElement("small"); s2.textContent = c;
    t.append(s1, b1, s2); box.appendChild(t);
  });
}

function renderDash(){
  if (!$("viewDash")) return;
  document.querySelectorAll(".range button").forEach(b => b.setAttribute("aria-pressed", b.dataset.r === dRange));
  const days = rangeDays();
  dashTiles(days); chartKcal(days); chartWeight(days); chartBank(days); dashNutri(days);
  /* 일자별 기록 (기간 안, 최신부터) */
  const h = $("hist"); h.textContent = "";
  const ks = days.filter(k => dayOf(k).items.length || dayOf(k).weight).reverse();
  if (!ks.length){ const e=document.createElement("div"); e.className="empty"; e.textContent="기록이 쌓이면 여기에 보여요."; h.appendChild(e); }
  ks.forEach(k => {
    const dk = dayOf(k), s = sum(dk);
    const b = document.createElement("button"); b.type="button"; b.className = "hrow" + (s>GOAL?" over":"");
    b.innerHTML = `<span class="emo"></span><span></span><span class="mini"><i></i></span><span class="k num"></span><span class="w num"></span>`;
    { const ev = evalDay(dk); b.children[0].textContent = ev ? ev.emoji : ""; if (ev) b.children[0].title = `${ev.label} (${ev.pass}/${ev.total})`; }
    b.children[1].textContent = k;
    b.children[2].firstChild.style.width = Math.min(100,s/GOAL*100)+"%";
    b.children[3].textContent = dk.items.length ? fmt(s) : "";
    { const w = dk.weight, ws = b.children[4];
      if (w) {
        const dTxt = wDelta(w);
        const show = () => { ws.textContent = shownW.has(k) ? w + "kg" : dTxt; ws.title = shownW.has(k) ? "시작 대비 " + dTxt : "눌러서 실제 몸무게 보기"; };
        ws.classList.add("tap"); show();
        ws.onclick = e => { e.stopPropagation(); shownW.has(k) ? shownW.delete(k) : shownW.add(k); show(); };
      } else ws.textContent = "";
    }
    b.onclick = () => goDay(k);
    h.appendChild(b);
  });
}


/* 하루 평가: 칼로리 범위 + 영양소 6개 기준 통과 수 */
function evalDay(d){
  const its = (d && d.items) || []; if (!its.length) return null;
  const t = sum(d); const sd = STD[stdKey] || STD.custom;
  const checks = [];
  checks.push({k:"kcal", ok: t >= (+G.minKcal||0) && t <= GOAL});
  const withN = its.filter(i => has(i.protein) || has(i.carbs) || has(i.fat));
  if (withN.length){
    const S = k => withN.reduce((a,i)=>a+(+i[k]||0),0);
    const c = S("carbs"), p = S("protein"), f = S("fat"), mk = c*4 + p*4 + f*9;
    checks.push({k:"carbs", ok: c >= sd.carb}, {k:"protein", ok: p >= sd.prot}, {k:"fat", ok: mk > 0 && f*9/mk*100 <= sd.fat},
      {k:"fiber", ok: S("fiber") >= sd.fib}, {k:"sugar", ok: S("sugar") <= sd.sug}, {k:"sodium", ok: S("sodium") <= sd.na});
  }
  const pass = checks.filter(x => x.ok).length, total = checks.length, r = pass / total;
  const overBig = t > GOAL + 300;
  const lv = overBig ? 3 : total === 1 ? (pass ? 1 : 2) : r >= 0.85 ? 0 : r >= 0.6 ? 1 : r >= 0.4 ? 2 : 3;
  const E = [["😄","아주 좋아요"],["🙂","괜찮아요"],["😐","아쉬워요"],["😟","보완이 필요해요"]];
  return {emoji: E[lv][0], label: E[lv][1], pass, total, miss: checks.filter(x => !x.ok).map(x => x.k)};
}

/* 음식 이름에서 양 뽑기: "방울토마토 200g" → 방울토마토 / 200 / g */
const AMT_RE = /\s*(\d+(?:\.\d+)?|\d+\/\d+)\s*(kg|g|ml|L|개|장|알|조각|봉|컵|잔|캔|팩|공기|접시|줄|그릇|큰술|작은술|숟갈|쪽|마리)(?![가-힣])/;
function splitName(label){
  const m = label.match(/^(.*?)\s*\((.*)\)\s*$/); let base = m ? m[1] : label; let amount = null, unit = null;
  const am = base.match(AMT_RE);
  if (am){ amount = am[1].includes("/") ? (+am[1].split("/")[0] / +am[1].split("/")[1]) : +am[1]; unit = am[2]; base = (base.slice(0, am.index) + base.slice(am.index + am[0].length)).trim(); }
  const source = label.includes("성분표") ? "label" : label.includes("추정") ? "estimate" : "unknown";
  return {name: base.trim() || label, amount, unit, source};
}

$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const label = $("fName").value.trim(), kcal = +$("fKcal").value;
  if (!label || !(kcal>=0)) return;
  const sp = splitName(label);
  const row = {id: nextEntryId(cur), date: cur, meal: MEAL_CODE[$("fMeal").value] || "snack", name: sp.name, amount: sp.amount, unit: sp.unit, foodId: null,
    kcal, carbs:null, protein:null, fat:null, fiber:null, sugar:null, sodium:null, source: sp.source, label};
  [["fCarb","carbs"],["fProt","protein"],["fFat","fat"],["fFib","fiber"],["fSugar","sugar"],["fNa","sodium"]].forEach(([id,k]) => { if ($(id).value !== "") row[k] = +$(id).value; $(id).value = ""; });
  $("fName").value = ""; $("fKcal").value = "";
  put("entries", row.id, row);
  closeSheet($("dlgFood"));
});

function calcBMR(w, g){ g = g || G; const b = 10*w + 6.25*(+g.height) - 5*(+g.age) + (g.sex === "m" ? 5 : -161); return Math.round(b); }
function goalFrom(){ const num = id => +$(id).value;
  return {id:"goal", sex:$("gSex").value, age:num("gAge"), height:num("gHeight"), activityLevel:+$("gAct").value, startDate:$("gStart").value || GDEF.startDate,
    startWeight:num("gStartW"), targetWeight:num("gTargetW"), goalKcal:num("gGoal"), minKcal:num("gMin"), watchBaseKcal:num("gWatch"), standardId:$("stdSel").value}; }
function fillGoal(){
  $("gSex").value = G.sex; $("gAge").value = G.age; $("gHeight").value = G.height; $("gAct").value = String(G.activityLevel);
  $("gStart").value = G.startDate; $("gStartW").value = G.startWeight; $("gTargetW").value = G.targetWeight;
  $("gGoal").value = G.goalKcal; $("gMin").value = G.minKcal; $("gWatch").value = G.watchBaseKcal; $("stdSel").value = STD[G.standardId] ? G.standardId : "custom"; showCalc();
}
let recGoal = null;
function showCalc(){
  const g = goalFrom(); const box = $("gCalc"); box.textContent = "";
  if (!(g.age > 0 && g.height > 0 && g.startWeight > 0)){ box.textContent = "나이, 키, 체중을 넣으면 계산해 드려요."; return; }
  const lw = latestWeight(); const w = lw ? lw.w : g.startWeight;
  const bmr = calcBMR(w, g), tdee = Math.round(bmr * g.activityLevel);
  const floor = g.sex === "m" ? 1500 : 1200;
  const lo = Math.max(floor, Math.round((tdee - 500)/10)*10), hi = Math.max(floor, Math.round((tdee - 300)/10)*10);
  recGoal = Math.round((lo + hi)/2/10)*10;
  const def = tdee - (g.goalKcal || 0); const perWeek = def * 7 / 7700;
  const toGo = w - g.targetWeight; const weeks = perWeek > 0 && toGo > 0 ? Math.ceil(toGo / perWeek) : null;
  const rows = [
    ["기초대사량", `${fmt(bmr)} kcal`, `현재 체중 ${w}kg 기준`],
    ["하루 소비 (추정)", `${fmt(tdee)} kcal`, "기초대사량 × 활동량"],
    ["추천 목표", `${fmt(lo)}~${fmt(hi)} kcal`, "하루 300~500kcal 적게"],
    ["지금 목표로", g.goalKcal ? (def > 0 ? `주 약 ${perWeek.toFixed(2)}kg 감량` : "감량보다 유지에 가까워요") : "–", weeks ? `목표까지 약 ${weeks}주` : (toGo <= 0 ? "목표 체중 도달" : "")]
  ];
  rows.forEach(([a,b,c]) => { const r = document.createElement("div"); r.className = "crow";
    const x = document.createElement("span"); x.textContent = a; const y = document.createElement("b"); y.className = "num"; y.textContent = b; const z = document.createElement("small"); z.textContent = c;
    r.append(x, y, z); box.appendChild(r); });
  const warn = [];
  if (g.goalKcal && g.goalKcal < floor) warn.push(`하루 ${fmt(floor)}kcal 아래는 권하지 않아요.`);
  if (perWeek > 1) warn.push("일주일에 1kg 넘게 빼는 속도는 무리가 될 수 있어요.");
  $("gNote").textContent = warn.join(" ") + (warn.length ? " " : "") + "계산은 Mifflin-St Jeor 공식을 쓴 추정값이에요.";
}
["gSex","gAge","gHeight","gAct","gStartW","gTargetW","gGoal","gMin"].forEach(id => $(id).addEventListener("input", showCalc));
$("gUseRec").onclick = () => { showCalc(); if (recGoal){ $("gGoal").value = recGoal; showCalc(); } };
$("gForm").addEventListener("submit", async e => {
  e.preventDefault(); const g = goalFrom();
  if (!(g.goalKcal > 0 && g.startWeight > 0 && g.targetWeight > 0)) { $("gNote").textContent = "하루 목표, 시작 체중, 목표 체중을 넣어 주세요."; return; }
  applyGoal(g); $("gNote").textContent = "저장했어요.";
  if (db){ try { await db.collection("settings").doc("goal").set(G); } catch(e){ $("gNote").textContent = "저장하지 못했어요. 다시 시도해 주세요."; } } else lsSave();
});
function applyGoal(g){ G = {...GDEF, ...g}; stdKey = STD[G.standardId] ? G.standardId : "custom"; GOAL = +G.goalKcal; START_W = +G.startWeight; TARGET_W = +G.targetWeight; render(); }

/* ---------- 영양 참고 (foods) ---------- */
let openId = null;
CAT_CODES.forEach(([c,l]) => { const o = document.createElement("option"); o.value = c; o.textContent = l; $("pCat").appendChild(o); });
$("pSrc").innerHTML = '<option value="estimate">추정</option><option value="label">성분표</option>';

const daysLeft = e => { if (!e) return null; const [y,m,d] = e.split("-").map(Number); const t = new Date(); return Math.round((new Date(y,m-1,d) - new Date(t.getFullYear(),t.getMonth(),t.getDate()))/86400000); };
const expLabel = e => { const n = daysLeft(e); if (n === null) return ""; if (n < 0) return "기한 지남"; if (n === 0) return "오늘까지"; if (n <= 7) return `${n}일 남음`; return e; };

const METRICS = [
  {k:"protein", label:"단백질", unit:"g", dir:-1, hint:"1회 기준량에 단백질이 많은 순서예요."},
  {k:"fiber", label:"식이섬유", unit:"g", dir:-1, hint:"1회 기준량에 식이섬유가 많은 순서예요."},
  {k:"sugar", label:"당류 적은", unit:"g", dir:1, hint:"당류가 적은 순서예요. 간 건강과 체중 관리엔 첨가당을 줄이는 게 핵심이에요."},
  {k:"sodium", label:"나트륨 적은", unit:"mg", dir:1, hint:"나트륨이 적은 순서예요. 짜게 먹은 날 참고하세요."},
  {k:"satFat", label:"포화지방 주의", unit:"g", dir:-1, hint:"포화지방이 많은 순서예요. 위쪽 음식은 가끔만 드세요."}
];
let metric = "protein";
try { const m = localStorage.getItem("diet-metric"); if (METRICS.some(x => x.k === m)) metric = m; } catch(e){}

function pItem(id, it, mt, maxv){
  const w = document.createElement("div"); w.className = "pi";
  const row = document.createElement("div"); row.className = "pi-row";
  const main = document.createElement("button"); main.type = "button"; main.className = "pi-main"; main.setAttribute("aria-expanded", openId === id);
  const nm = document.createElement("span"); nm.textContent = it.name;
  const tg = document.createElement("span"); tg.className = "tag" + (it.source === "label" ? "" : " est"); tg.textContent = it.source === "label" ? "성분표" : "추정";
  const sub = document.createElement("span"); sub.className = "sub";
  const per = mt && (mt.k === "protein" || mt.k === "fiber") && +it.kcal > 0 ? `100kcal당 ${(+it[mt.k] / +it.kcal * 100).toFixed(1)}g` : "";
  sub.textContent = [it.serving && it.serving.label, has(it.kcal) ? fmt(it.kcal)+" kcal" : "", per].filter(Boolean).join(" · ");
  main.append(nm, tg, sub);
  main.onclick = () => { openId = openId === id ? null : id; renderPantry(); };
  const ex = document.createElement("span"); const n = daysLeft(it.expiry);
  ex.className = "exp soon"; ex.textContent = n !== null && n <= 7 ? expLabel(it.expiry) : "";
  const right = document.createElement("span"); right.className = "val";
  if (mt){
    const v = +it[mt.k]; const b = document.createElement("b"); b.textContent = (Number.isInteger(v) ? v : v.toFixed(1)) + mt.unit;
    const bar = document.createElement("span"); bar.className = "vbar" + (mt.k === "satFat" ? " bad" : ""); const fi = document.createElement("i"); fi.style.width = (maxv > 0 ? Math.max(4, v / maxv * 100) : 4) + "%"; bar.appendChild(fi);
    right.append(b, bar);
  }
  row.append(main, ex, right); w.appendChild(row);
  if (openId === id){
    const dt = document.createElement("div"); dt.className = "pi-detail";
    const nut = document.createElement("div"); nut.className = "nut";
    [["탄수화물",it.carbs,"g"],["단백질",it.protein,"g"],["지방",it.fat,"g"],["당류",it.sugar,"g"],["포화지방",it.satFat,"g"],["식이섬유",it.fiber,"g"],["나트륨",it.sodium,"mg"],["kcal",it.kcal,""]].forEach(([l,v,u]) => {
      const c = document.createElement("div"); const b = document.createElement("b"); b.textContent = has(v) ? v + u : "–"; const s = document.createElement("span"); s.textContent = l; c.append(b, s); nut.appendChild(c);
    });
    dt.appendChild(nut);
    if (it.memo || it.note){ const p = document.createElement("div"); p.textContent = it.memo || it.note; dt.appendChild(p); }
    const acts = document.createElement("div"); acts.className = "acts";
    if (it.kcal){
      const add = document.createElement("button"); add.type = "button"; add.className = "linkbtn"; const ml = mealNowLabel();
      add.textContent = `+ 오늘 ${ml}에 기록`;
      add.onclick = () => {
        const k = keyOf(new Date()); const sv = it.serving || {};
        const label = it.name + (sv.label ? " " + sv.label : "") + ` (${SRC_LABEL[it.source] || "추정"})`;
        const rec = {id: nextEntryId(k), date: k, meal: MEAL_CODE[ml], name: it.name, amount: sv.amount ?? null, unit: sv.unit ?? null, foodId: id,
          kcal: +it.kcal, carbs:null, protein:null, fat:null, fiber:null, sugar:null, sodium:null, source: it.source || "estimate", label};
        ["carbs","protein","fat","fiber","sugar","sodium"].forEach(n => { if (has(it[n])) rec[n] = +it[n]; });
        put("entries", rec.id, rec); add.textContent = "기록했어요 ✓";
      };
      acts.appendChild(add);
    }
    const dl = document.createElement("button"); dl.type = "button"; dl.className = "linkbtn del2"; dl.textContent = "삭제";
    dl.onclick = () => { if (dl.dataset.c){ del("foods", id); } else { dl.dataset.c = 1; dl.textContent = "한 번 더 누르면 삭제"; } };
    acts.appendChild(dl); dt.appendChild(acts); w.appendChild(dt);
  }
  return w;
}

function renderPantry(){
  const ch = $("pChips"); ch.textContent = "";
  METRICS.forEach(m => { const b = document.createElement("button"); b.type = "button"; b.className = "nchip"; b.textContent = m.label; b.setAttribute("aria-pressed", m.k === metric);
    b.onclick = () => { metric = m.k; openId = null; try { localStorage.setItem("diet-metric", metric); } catch(e){} renderPantry(); }; ch.appendChild(b); });
  const mt = METRICS.find(m => m.k === metric);
  $("pHint").textContent = mt.hint;
  const ents = Object.entries(T.foods).sort((a,b) => (a[1].name||"").localeCompare(b[1].name||"", "ko"));
  const rk = $("pRank"); rk.textContent = "";
  const ranked = ents.filter(([,i]) => has(i[mt.k])).sort((a,b) => mt.dir * (+a[1][mt.k] - +b[1][mt.k])).slice(0, 10);
  const maxv = Math.max(0, ...ents.filter(([,i]) => has(i[mt.k])).map(([,i]) => +i[mt.k]));
  ranked.forEach(([id,it]) => rk.appendChild(pItem(id, it, mt, maxv)));
  if (!ranked.length){ const e = document.createElement("div"); e.className = "empty"; e.textContent = "이 영양소 정보가 있는 음식이 아직 없어요."; rk.appendChild(e); }
  const list = $("pList"); list.textContent = "";
  CAT_CODES.forEach(([c, l]) => { const arr = ents.filter(([,i]) => (i.category||"etc") === c); if (!arr.length) return;
    const s = document.createElement("section"); const h = document.createElement("h2"); h.textContent = l; s.appendChild(h);
    arr.forEach(([id,it]) => s.appendChild(pItem(id, it, null, 0))); list.appendChild(s); });
  if (!ents.length){ const e = document.createElement("div"); e.className = "empty"; e.textContent = "아직 음식이 없어요. 아래에서 추가해 보세요."; list.appendChild(e); }
}

$("pForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("pName").value.trim(); if (!name) return;
  const num = id => $(id).value === "" ? null : +$(id).value;
  const label = $("pUnit").value.trim(); const sm = label.match(/(\d+(?:\.\d+)?)\s*(g|ml)/);
  const id = "f" + Date.now().toString(36);
  const it = {id, name, category: $("pCat").value, serving: {label, amount: sm ? +sm[1] : null, unit: sm ? sm[2] : null},
    kcal: num("pKcal"), carbs: num("pCarb"), protein: num("pProt"), fat: num("pFat"), satFat: num("pSat"), fiber: num("pFib"), sugar: num("pSugar"), sodium: num("pNa"),
    source: $("pSrc").value};
  if ($("pExp").value) it.expiry = $("pExp").value;
  put("foods", id, it);
  $("pForm").reset();
});

const showTab = t => { if (t === true) t = "p"; if (t === false) t = "d";
  [["h","viewDash","tabDash"],["d","viewDiet","tabDiet"],["p","viewPantry","tabPantry"],["g","viewGoal","tabGoal"]].forEach(([k,v,b]) => { $(v).hidden = k !== t; $(b).setAttribute("aria-selected", k === t); });
  document.querySelector(".daynav").classList.toggle("off", t !== "d");
  if (t === "g") fillGoal();
  try { localStorage.setItem("diet-tab", t); } catch(e){} };
$("tabGoal").onclick = () => showTab("g");
$("tabDash").onclick = () => showTab("h");
$("tabDiet").onclick = () => showTab(false);
$("tabPantry").onclick = () => showTab(true);
try { const tb = localStorage.getItem("diet-tab"); if (tb === "p" || tb === "g" || tb === "d") showTab(tb); else showTab("h"); } catch(e){ showTab("h"); }

function renderAll(){ render(); renderPantry(); }
lsLoad(); applyGoal(G); renderPantry();

(async () => {
  try { db = window.claude && await window.claude.use("db"); } catch(e){ db = null; }
  if (!db){ $("saveNote").textContent = "이 화면에서는 기록이 이 기기에만 저장돼요."; return; }
  const fail = () => { $("saveNote").textContent = "기록을 불러오지 못했어요. 새로고침해 주세요."; };
  const sub = (table, q) => (q || db.collection(table)).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(doc => { if (doc.exists) m[doc.id] = doc.data(); });
    if (table === "entries"){ /* 최근 범위 밖에서 따로 불러온 날짜는 유지 */
      Object.values(T.entries).forEach(e => { if (e.date < CUTOFF && !m[e.id]) m[e.id] = e; });
    }
    T[table] = m; table === "foods" ? renderPantry() : render();
  }, fail);
  /* 기록은 최근 120일만 실시간으로 받고, 더 옛날 날짜는 그 날로 이동할 때 불러온다 */
  const c = new Date(); c.setDate(c.getDate() - 120); const CUTOFF = keyOf(c);
  sub("entries", db.collection("entries").where("date", ">=", CUTOFF));
  sub("activity"); sub("body"); sub("foods");
  db.collection("settings").doc("goal").onSnapshot(sn => { if (sn.exists){ applyGoal(sn.data()); if (!$("viewGoal").hidden && !$("gForm").contains(document.activeElement)) fillGoal(); } }, () => {});
  const loadOld = async k => { if (k >= CUTOFF) return; try { const s = await db.collection("entries").where("date", "==", k).get(); s.docs.forEach(d => { T.entries[d.id] = d.data(); }); render(); } catch(e){} };
  const oldShift = shift;
  $("prev").onclick = () => { oldShift(-1); loadOld(cur); };
})();
</script>
